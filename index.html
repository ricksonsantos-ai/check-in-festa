<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Festa dos Professores</title>
    <style>
        :root {
            --roxo: #4B0082 !important;
            --fundo: #f4f4f9 !important;
            --verde: #28a745 !important;
            --vermelho: #dc3545 !important;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            background-color: var(--fundo) !important;
            color: #333 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 20px !important;
            box-sizing: border-box !important;
        }
        .container {
            background: white !important;
            padding: 40px !important;
            border-radius: 15px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important;
            width: 100% !important;
            max-width: 500px !important;
            text-align: center !important;
        }
        h2 {
            color: var(--roxo) !important;
            margin-top: 0 !important;
            margin-bottom: 25px !important;
        }
        #loading {
            color: #666 !important;
            font-weight: bold !important;
            margin-bottom: 20px !important;
            word-wrap: break-word !important;
        }
        .input-group {
            margin-bottom: 25px !important;
            text-align: left !important;
            position: relative !important; 
        }
        label {
            font-weight: bold !important;
            display: block !important;
            margin-bottom: 8px !important;
            color: #555 !important;
        }
        input {
            width: 100% !important;
            padding: 15px !important;
            font-size: 16px !important;
            border: 2px solid #ddd !important;
            border-radius: 8px !important;
            box-sizing: border-box !important;
            transition: border-color 0.3s !important;
        }
        input:focus {
            border-color: var(--roxo) !important;
            outline: none !important;
        }
        
        #sugestoes {
            position: absolute !important;
            top: 100% !important;
            left: 0 !important;
            right: 0 !important;
            background: white !important;
            border: 1px solid #ddd !important;
            border-top: none !important;
            border-radius: 0 0 8px 8px !important;
            max-height: 200px !important;
            overflow-y: auto !important;
            z-index: 1000 !important;
            display: none !important; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1) !important;
        }
        .sugestao-item {
            padding: 10px 15px !important;
            cursor: pointer !important;
            border-bottom: 1px solid #f0f0f0 !important;
            text-transform: uppercase !important;
        }
        .sugestao-item:last-child {
            border-bottom: none !important;
        }
        .sugestao-item:hover {
            background-color: #f9f9f9 !important;
            color: var(--roxo) !important;
            font-weight: bold !important;
        }

        .buttons {
            display: flex !important;
            gap: 15px !important;
        }
        button {
            flex: 1 !important;
            color: white !important;
            border: none !important;
            padding: 15px !important;
            border-radius: 8px !important;
            font-size: 16px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            transition: opacity 0.2s, transform 0.1s !important;
        }
        button:hover:not(:disabled) {
            opacity: 0.9 !important;
            transform: scale(1.02) !important;
        }
        button:disabled {
            background: #ccc !important;
            cursor: not-allowed !important;
            transform: none !important;
        }
        .btn-checkin { background-color: var(--verde) !important; }
        .btn-desfazer { background-color: var(--vermelho) !important; }
        
        #mensagem {
            margin-top: 20px !important;
            font-size: 16px !important;
            font-weight: bold !important;
            min-height: 25px !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Festa dos Professores 2026</h2>
        
        <div id="loading">A conectar com a planilha do Google...</div>
        
        <div id="appForm" style="display: none;">
            <div class="input-group">
                <label for="buscaNome">Buscar Nome:</label>
                <input type="text" id="buscaNome" placeholder="Comece a digitar para procurar..." autocomplete="off">
                <div id="sugestoes"></div>
            </div>
            
            <div class="buttons">
                <button id="btnCheckin" class="btn-checkin" onclick="processarAcao('checkin')">Fazer Check-in</button>
                <button id="btnDesfazer" class="btn-desfazer" onclick="processarAcao('desfazer')">Desfazer</button>
            </div>
        </div>

        <div id="mensagem"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxSem8E1FShG416jET9EqrPwUZxzo9AfGppXGKCNpqVyxUQWJaJVWbVhVT0DVB5hwz4iw/exec';
        
        let nomesCarregados = []; 

        window.onload = function() {
            fetch(scriptURL + '?action=getNomes', { method: 'GET', redirect: 'follow' })
                .then(async response => {
                    const text = await response.text();
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        throw new Error("Erro de leitura do servidor: " + text.substring(0, 80));
                    }
                })
                .then(nomes => {
                    // Limpeza radical: converte tudo para texto, limpa os espaços vazios e remove os itens em branco
                    nomesCarregados = nomes
                        .filter(n => n !== null && n !== undefined)
                        .map(n => String(n).trim())
                        .filter(n => n !== "");
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('appForm').style.display = 'block';
                    
                    const divMsg = document.getElementById('mensagem');
                    divMsg.innerText = nomesCarregados.length + " professores carregados com sucesso!";
                    divMsg.style.color = "#4B0082";
                    
                    configurarPesquisa(); 
                })
                .catch(error => {
                    const boxErro = document.getElementById('loading');
                    boxErro.style.color = "red";
                    boxErro.innerText = "ERRO: " + error.message;
                    console.error('Erro:', error);
                });
        };

        function configurarPesquisa() {
            const input = document.getElementById('buscaNome');
            const sugestoesBox = document.getElementById('sugestoes');

            input.addEventListener('input', function() {
                const termo = String(this.value).toUpperCase().trim();
                sugestoesBox.innerHTML = ''; 
                
                if (!termo) {
                    sugestoesBox.style.display = 'none'; 
                    return;
                }

                // Cria uma lista segura para procurar, removendo acentos e convertendo para maiúsculas
                const termoLimpo = termo.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                const resultados = nomesCarregados.filter(nome => {
                    const nomeLimpo = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                    return nomeLimpo.includes(termoLimpo);
                });

                if (resultados.length > 0) {
                    const limiteResultados = resultados.slice(0, 15);
                    
                    limiteResultados.forEach(nome => {
                        const div = document.createElement('div');
                        div.className = 'sugestao-item';
                        div.innerText = nome;
                        
                        div.addEventListener('click', function() {
                            input.value = nome;
                            sugestoesBox.style.display = 'none';
                        });
                        
                        sugestoesBox.appendChild(div);
                    });
                    sugestoesBox.style.display = 'block'; 
                } else {
                    sugestoesBox.style.display = 'none';
                }
            });

            document.addEventListener('click', function(e) {
                if (e.target !== input && e.target !== sugestoesBox) {
                    sugestoesBox.style.display = 'none';
                }
            });
        }

        function processarAcao(acao) {
            const inputNome = document.getElementById('buscaNome');
            const nomeSelecionado = String(inputNome.value).trim();
            const divMensagem = document.getElementById('mensagem');
            
            if (!nomeSelecionado) {
                divMensagem.style.color = 'red';
                divMensagem.innerText = "Por favor, selecione ou digite um nome.";
                return;
            }

            document.getElementById('btnCheckin').disabled = true;
            document.getElementById('btnDesfazer').disabled = true;
            divMensagem.style.color = '#333';
            divMensagem.innerText = "A processar no servidor...";

            const params = new URLSearchParams({
                action: acao,
                nome: nomeSelecionado
            });

            fetch(scriptURL + '?' + params.toString(), { method: 'GET', redirect: 'follow' })
                .then(async response => {
                    return await response.text();
                })
                .then(resultado => {
                    if (resultado.includes("Erro")) {
                        divMensagem.style.color = 'red';
                    } else if (acao === 'checkin') {
                        divMensagem.style.color = 'green';
                    } else {
                        divMensagem.style.color = 'orange';
                    }
                    divMensagem.innerText = resultado;
                    
                    inputNome.value = '';
                })
                .catch(error => {
                    divMensagem.style.color = 'red';
                    divMensagem.innerText = "Erro de ligação com a planilha. Tente novamente.";
                })
                .finally(() => {
                    document.getElementById('btnCheckin').disabled = false;
                    document.getElementById('btnDesfazer').disabled = false;
                    inputNome.focus();
                });
        }
    </script>
</body>
</html>
